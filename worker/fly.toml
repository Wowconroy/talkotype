# Deploy: cd worker && fly launch --copy-config --name talkotype-worker
# Secrets: fly secrets set GROQ_API_KEY=... R2_*=... SUPABASE_*=... WORKER_SHARED_SECRET=...

app = "talkotype-worker"
primary_region = "ams"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"
